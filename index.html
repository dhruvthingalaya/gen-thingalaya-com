<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thingalaya Barcode Generator</title>

    <link rel="stylesheet" href="/style.css" />
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
  </head>

  <body>
    <header class="site-header">
      <div class="container">
        <div class="brand">
          <img
            src="/assets/thingalaya-logo.svg"
            alt="Thingalaya logo"
            class="brand-logo"
          />
          <div>
            <p class="brand-kicker">
              <a href="https://thingalaya.com" target="_blank" rel="noopener noreferrer">Thingalaya</a>
            </p>
            <h1>Barcode / QR Generator</h1>
          </div>
        </div>
        <div class="header-actions">
          <a
            href="https://github.com/dhruvthingalaya/gen-thingalaya-com"
            target="_blank"
            rel="noopener noreferrer"
            class="github-btn"
          >
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>
    </header>

    <main class="site-main">
      <section class="generator container">
        <p>
          Inputs: <code>data</code>, <code>type</code>, <code>format</code>,
          <code>ec</code> (QR only). Supported formats: <code>png</code>,
          <code>svg</code>, <code>pdf</code>.
        </p>

        <form id="generator-form">
          <div class="data-field">
            <label for="data">data</label>
            <textarea
              id="data"
              name="data"
              placeholder="Text to encode"
              rows="3"
              required
            ></textarea>
          </div>

          <div class="control-row">
            <div class="form-row">
              <div>
                <label for="type">type</label>
                <select id="type" name="type">
                  <option value="qrcode">QR</option>
                  <option value="microqrcode">Micro QR</option>
                  <option value="azteccode">Aztec</option>
                  <option value="aztecrune">Aztec Runes</option>
                  <option value="datamatrix">Data Matrix</option>
                  <option value="gridmatrix">Grid Matrix (Han Xin)</option>
                  <option value="maxicode">MaxiCode</option>
                  <option value="pdf417">PDF417</option>
                  <option value="code128">CODE128</option>
                  <option value="ean13">EAN13</option>
                </select>
              </div>

              <div>
                <label for="format">format</label>
                <select id="format" name="format">
                  <option value="png">png</option>
                  <option value="svg">svg</option>
                  <option value="pdf">pdf</option>
                </select>
              </div>

              <div>
                <label for="ec">error correction</label>
                <select id="ec" name="ec">
                  <option value="L">L (7%)</option>
                  <option value="M" selected>M (15%)</option>
                  <option value="Q">Q (25%)</option>
                  <option value="H">H (30%)</option>
                </select>
              </div>
            </div>

            <div class="actions">
              <button type="submit">Generate</button>
              <button
                type="button"
                id="download-btn"
                aria-label="Download generated code"
                title="Download generated code"
                disabled
              >
                <i class="fa-solid fa-download"></i>
              </button>
            </div>
          </div>
        </form>

        <div id="preview">Preview appears here</div>
        <div id="status"></div>
      </section>

      <section class="help container prose">
        <h2>Documentation</h2>
        <div id="readme-preview">Loading README...</div>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bwip-js/4.3.1/bwip-js-min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
      const form = document.getElementById("generator-form");
      const preview = document.getElementById("preview");
      const status = document.getElementById("status");
      const downloadBtn = document.getElementById("download-btn");
      const readmePreview = document.getElementById("readme-preview");
      let latestDownload = null;

      const typeMap = {
        qr: "qrcode",
        qrcode: "qrcode",
        microqr: "microqrcode",
        microqrcode: "microqrcode",
        aztec: "azteccode",
        azteccode: "azteccode",
        aztecrunes: "aztecrune",
        aztecrune: "aztecrune",
        datamatrix: "datamatrix",
        gridmatrix: "hanxin",
        maxicode: "maxicode",
        pdf417: "pdf417",
        code128: "code128",
        ean13: "ean13",
      };

      const qrSupportedTypes = ["qrcode", "microqrcode"];

      const ecSelect = document.getElementById("ec");

      function isQrType(type) {
        return qrSupportedTypes.includes((type || "").toLowerCase());
      }

      function updateEcUX() {
        const selectedType = form.type.value;

        const enabled = isQrType(selectedType);

        ecSelect.disabled = !enabled;

        if (enabled) {
          ecSelect.title = "QR error correction level";
          ecSelect.style.opacity = "1";
        } else {
          ecSelect.title =
            "Error correction is only available for QR and Micro QR";
          ecSelect.style.opacity = "0.6";
        }
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");

        a.href = url;
        a.download = filename;
        a.click();

        URL.revokeObjectURL(url);
      }

      function readQueryInput() {
        const p = new URLSearchParams(location.search);

        return {
          data: p.get("data"),
          type: p.get("type"),
          format: p.get("format"),
          ec: p.get("ec"),
        };
      }

      function buildBwipOptions(data, type, ec = "M") {
        const bcid = typeMap[(type || "").toLowerCase()];

        if (!bcid) {
          throw new Error(
            "Unsupported type. Use QR, MICROQR, AZTEC, AZTECRUNES, DATAMATRIX, GRIDMATRIX, MAXICODE, PDF417, CODE128, EAN13.",
          );
        }

        const text = data == null ? "" : String(data);

        if (!text.trim()) {
          throw new Error("Data is required.");
        }

        if (bcid === "aztecrune") {
          if (!/^\d+$/.test(text.trim())) {
            throw new Error(
              "Aztec Runes requires a whole number from 0 to 255.",
            );
          }

          const n = Number(text.trim());

          if (n < 0 || n > 255) {
            throw new Error("Aztec Runes value must be between 0 and 255.");
          }
        }

        const options = {
          bcid,
          text,
          scale: 4,
          includetext: false,
          paddingwidth: 8,
          paddingheight: 8,
        };

        // QR-only error correction
        if (qrSupportedTypes.includes(bcid)) {
          const normalizedEc = String(ec || "M").toUpperCase();

          if (!["L", "M", "Q", "H"].includes(normalizedEc)) {
            throw new Error(
              "Invalid QR error correction level. Use L, M, Q, or H.",
            );
          }

          options.eclevel = normalizedEc;
        }

        return options;
      }

      async function generateCode(data, type, format, ec) {
        const bwipOptions = buildBwipOptions(data, type, ec);

        const bcid = bwipOptions.bcid;

        preview.innerHTML = "";

        if (format === "svg") {
          const svgText = bwipjs.toSVG(bwipOptions);

          preview.innerHTML = svgText;

          latestDownload = {
            blob: new Blob([svgText], { type: "image/svg+xml" }),
            filename: `code-${bcid}.svg`,
          };

          return;
        }

        const canvas = document.createElement("canvas");

        await bwipjs.toCanvas(canvas, bwipOptions);

        preview.appendChild(canvas);

        if (format === "png") {
          latestDownload = await new Promise((resolve, reject) => {
            canvas.toBlob((blob) => {
              if (!blob) {
                reject(new Error("Failed to prepare PNG download."));
                return;
              }
              resolve({ blob, filename: `code-${bcid}.png` });
            }, "image/png");
          });

          return;
        }

        if (format === "pdf") {
          const { jsPDF } = window.jspdf;

          const pdf = new jsPDF({
            orientation: "portrait",
            unit: "pt",
            format: "a4",
          });

          const imgData = canvas.toDataURL("image/png");

          const pageW = pdf.internal.pageSize.getWidth();

          const pageH = pdf.internal.pageSize.getHeight();

          const maxW = pageW - 80;

          const maxH = pageH - 80;

          const ratio = Math.min(maxW / canvas.width, maxH / canvas.height);

          const w = canvas.width * ratio;

          const h = canvas.height * ratio;

          const x = (pageW - w) / 2;

          const y = (pageH - h) / 2;

          pdf.addImage(imgData, "PNG", x, y, w, h);

          latestDownload = {
            blob: pdf.output("blob"),
            filename: `code-${bcid}.pdf`,
          };

          return;
        }

        throw new Error("Unsupported format. Use png, svg, or pdf.");
      }

      async function renderImageOnly(data, type, format, ec) {
        const bwipOptions = buildBwipOptions(data, type, ec);

        const normalizedFormat = (format || "").toLowerCase();

        if (!["png", "svg"].includes(normalizedFormat)) {
          throw new Error("Image-only mode supports png or svg.");
        }

        document.body.innerHTML = "";

        Object.assign(document.body.style, {
          margin: "0",
          padding: "0",
          background: "#fff",
          display: "grid",
          placeItems: "center",
          minHeight: "100vh",
        });

        if (normalizedFormat === "svg") {
          document.body.innerHTML = bwipjs.toSVG(bwipOptions);

          return;
        }

        const canvas = document.createElement("canvas");

        await bwipjs.toCanvas(canvas, bwipOptions);

        document.body.appendChild(canvas);
      }

      form.type.addEventListener("change", updateEcUX);
      downloadBtn.addEventListener("click", () => {
        if (!latestDownload) return;
        downloadBlob(latestDownload.blob, latestDownload.filename);
      });

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = form.data.value.trim();

        const type = form.type.value.trim();

        const format = form.format.value.trim().toLowerCase();

        const ec = form.ec.value.trim().toUpperCase();

        if (!data) return;

        latestDownload = null;
        downloadBtn.disabled = true;
        status.textContent = "Generating...";

        try {
          await generateCode(data, type, format, ec);

          downloadBtn.disabled = false;
          status.textContent = `Generated ${type.toUpperCase()} as ${format.toUpperCase()}. Click Download to save.`;
        } catch (err) {
          status.textContent = err.message;
        }
      });

      (function bootstrapFromQuery() {
        const { data, type, format, ec } = readQueryInput();

        const normalizedType = (type || "").toLowerCase();

        const normalizedFormat = (format || "").toLowerCase();

        const normalizedEc = (ec || "M").toUpperCase();

        const embedded = window.self !== window.top;

        if (data) form.data.value = data;

        if (normalizedType && typeMap[normalizedType]) {
          form.type.value = typeMap[normalizedType];
        }

        if (
          normalizedFormat &&
          ["png", "svg", "pdf"].includes(normalizedFormat)
        ) {
          form.format.value = normalizedFormat;
        }

        if (["L", "M", "Q", "H"].includes(normalizedEc)) {
          form.ec.value = normalizedEc;
        }

        updateEcUX();

        if (data && normalizedType && normalizedFormat) {
          if (embedded && ["png", "svg"].includes(normalizedFormat)) {
            renderImageOnly(
              data,
              normalizedType,
              normalizedFormat,
              normalizedEc,
            ).catch((err) => {
              document.body.innerHTML = `
<pre style="margin:16px;font-family:monospace;white-space:pre-wrap;">${err.message}</pre>
`;
            });

            return;
          }

          form.requestSubmit();
        }
      })();

      (async function loadReadmePreview() {
        try {
          const response = await fetch(
            "https://raw.githubusercontent.com/dhruvthingalaya/gen-thingalaya-com/refs/heads/master/README.md",
          );
          if (!response.ok) throw new Error("Unable to load README.");
          const markdown = await response.text();
          readmePreview.innerHTML = marked.parse(markdown);
        } catch (err) {
          readmePreview.textContent = err.message;
        }
      })();
    </script>
  </body>
</html>
